<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">

</head>
<body>
    <form>
    <div class="container-centralizado">
        <img class="center" src="img/img/WhatsApp Image 2025-08-23 at 00.39.20.jpeg" width="280">
        </div>
    <h2 class="center"> Cadastro de Produtos</h2>

    <div class="form-item">
        <label for="usuario">INSIRA SEU NOME:</label><br>
        <input type="text" id="usuario" name="usuario" placeholder="Digite seu nome" required><br><br>
    </div>
    
    <div class="form-item">
        <label for="usuario">CPF:</label><br>
        <input type="text" id="usuario" name="usuario" placeholder="Favor: insira seu CPF" required><br><br>
    </div>
    
    <div class="form-item">
        <label for="usuario">NOME DA LOJA:</label><br>
        <input type="text" id="usuario" name="usuario" placeholder="Digite o nome da sua Loja" required><br><br>
    </div>
    
    <div class="form-item">
        <label for="usuario">NACIONALIDADE:</label><br>
        <select >
            <option> ARGENTINA</option>
             <option> BOLÍVIA</option>
             
              <option> BRASIL</option>
               <option> CHILE</option>
                <option> COLÔMBIA</option>
                 <option> EQUADOR</option>
                 <option> GUIANA</option>
                 <option> PARAGUAI</option>
                 <option> PERU</option>
                 <option> SURIAME</option>
                 <option> URUGUAI</option>
                 <option> VENEZUELA</option>

        </select><br><br>
    </div>

    <div class="form-item">
         <label for="produto">ADICIONE FOTOS:</label><br>
        <input type="" id="" name="" placeholder="adicione fotos do seu produto" required><br><br>
    </div>


    <div class="form-item">
        <label for="senha">SENHA:</label><br>
        <input type="password" id="senha" name="senha" placeholder="senha" minlength="8" required><br><br>
    </div>
    <div>
    <button>Cadastrar</button>
    </div> 
    </form>
</body>
</html>
