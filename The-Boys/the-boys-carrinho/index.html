<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Carrinho de Compras</title>
  <style>
    .barra {
      width: 100%;
      height: 50px;
      background-color: #000000;
      color: rgb(255, 255, 255);
      display: flex;
      align-items: left;
      justify-content: center;
      font-size: 20px;
      font-family: Arial, Helvetica, sans-serif;
    }
    
    body {
      font-family: Arial, sans-serif; 
      margin: 0;
      padding: 0;
      background-color: #ffffff; 
    }

    header {
      background-color: #3f3f3f; 
      color: white;         
      text-align: center;   
      padding: 15px;
    }

    .produtos {
      display: flex;        
      justify-content: center;
      gap: 20px;             
      margin: 20px;
    }

    .produto {
      background: white;    
      padding: 10px;
      border: 1px solid #ccc; 
      text-align: center;     
      width: 150px;
    }

    .produto img {
      width: 100%;         
    }

    #carrinho {
      background: white;
      margin: 20px;
      padding: 10px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <header>
    <h1>Carrinho</h1>
  </header>

  <section class="produtos">
    <div class="produto">
      <img src="funk 1.jpg" alt="Produto 1">
      <p>Produto 1</p>
      <p>R$ 10,00</p>
      <button onclick="adicionar('Produto 1', 10)">Adicionar</button>
    </div>
    <div class="produto">
      <img src="lego 4.webp" alt="Produto 2">
      <p>Produto 2</p>
      <p>R$ 20,00</p>
      <button onclick="adicionar('Produto 2', 20)">Adicionar</button>
    </div>

    <div class="produto">
      <img src="lego 3.jpg" alt="Produto 3">
      <p>Produto 3</p>
      <p>R$ 30,00</p>
      <button onclick="adicionar('Produto 3',30)">Adicionar</button>
      </div>

      <div class="produto">
      <img src="lego 1.webp" alt="Produto 4">
      <p>Produto 4</p>
      <p>R$ 40,00</p>
      <button onclick="adicionar('Produto 4',40)">Adicionar</button>
      </div>

      <div class="produto">
      <img src="lego 2.webp" alt="Produto 5">
      <p>Produto 5</p>
      <p>R$ 50,00</p>
      <button onclick="adicionar('Produto 5',50)">Adicionar</button>
      </div>
  </section>


  <section id="carrinho">
    <h2>Itens no carrinho:</h2>
    <ul id="lista"></ul>
    <p><strong>Total:</strong> R$ <span id="total">0</span></p>
    <button>Finalizar Compra</button>
  </section>

  
  <script>
    let total = 0;

    function adicionar(nome, preco) {
     
      const lista = document.getElementById("lista");
      const item = document.createElement("li");
      item.textContent = nome + " - R$ " + preco;
      lista.appendChild(item);

      total += preco;
      document.getElementById("total").textContent = total;
    }
  </script>
</body>
</html>

</body>
</html>
